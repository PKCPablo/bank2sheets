<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bank2sheets callback</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.25rem; }
  label { display: block; font-weight: 600; margin: 1rem 0 0.25rem; }
  textarea { width: 100%; box-sizing: border-box; font-family: monospace; font-size: 0.85rem; padding: 0.5rem; border: 1px solid #bbb; border-radius: 4px; height: 4.5rem; resize: vertical; }
  button { margin-top: 0.75rem; padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
  .error { color: #b00020; font-weight: 600; }
  .hint { color: #555; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>bank2sheets authorization callback</h1>
<p class="hint">Copy the full URL and paste it into the bank2sheets terminal prompt.</p>
<p id="error" class="error" hidden></p>
<label for="full-url">Full callback URL</label>
<textarea id="full-url" readonly></textarea>
<button id="copy" type="button">Copy URL</button>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var errorEl = document.getElementById('error');
  var urlEl = document.getElementById('full-url');
  urlEl.value = location.href;
  if (params.get('error')) {
    errorEl.textContent = 'Authorization error: ' + params.get('error');
    errorEl.hidden = false;
  }
  document.getElementById('copy').addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(location.href);
    } else {
      urlEl.select();
      document.execCommand('copy');
    }
  });
})();
</script>
</body>
</html>
